name: Build FirestormIA Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 240

    env:
      LL_BUILD: /O2 /Ob2 /GR /W3 /c /Zi /nologo /DWIN32 /D_WINDOWS /arch:SSE2

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install autobuild
        run: pip install autobuild

      - name: Set up Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install prebuilt dependencies
        shell: pwsh
        run: |
          $maxAttempts = 5
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "Attempt $i of $maxAttempts: autobuild install..."
            autobuild install --install-dir="$env:GITHUB_WORKSPACE\packages"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Dependencies installed successfully."
              break
            }
            if ($i -lt $maxAttempts) {
              Write-Host "Failed (exit $LASTEXITCODE), retrying in 15s..."
              Start-Sleep -Seconds 15
            } else {
              Write-Host "All attempts failed."
              exit 1
            }
          }

      - name: Configure build
        shell: pwsh
        run: |
          autobuild configure -c ReleaseOS -- `
            -DADDRESS_SIZE=64 `
            -DLL_TESTS=OFF `
            -DPACKAGE=ON

      - name: Build Firestorm
        shell: pwsh
        run: |
          autobuild build -c ReleaseOS --no-configure

      - name: Find and collect artifacts
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter "*.exe" | Where-Object { $_.Name -like "Firestorm*" -or $_.Name -like "firestorm*" } | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination "FirestormIA-Windows.exe"
            Write-Host "Found installer: $($exe.FullName)"
          }
          $buildDir = Get-ChildItem -Recurse -Directory -Filter "newview" | Select-Object -First 1
          if ($buildDir) {
            Write-Host "Packaging build dir: $($buildDir.FullName)"
            Compress-Archive -Path "$($buildDir.FullName)\*" -DestinationPath "FirestormIA-Windows-full.zip" -CompressionLevel Fastest
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FirestormIA-Windows
          path: |
            FirestormIA-Windows.exe
            FirestormIA-Windows-full.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-*/**/*.log
            build-*/**/CMakeFiles/**/*.log
            build-*/**/CMakeCache.txt
          retention-days: 7
          if-no-files-found: ignore
